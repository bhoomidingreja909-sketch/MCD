<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>McDonald's India Supply Chain</title>
<style>
:root{--sky:#DDE3DC;--cream:#E6E1D3;--cream2:#CFCBC0;--red:#D2403F;--redS:#A82B2E;--gold:#F5C518;--goldE:#B8860B;--ink:#2B2622;--glass:#3A3A3F;
--road:#8C8C8C;--road2:#6F6F6F;--leaf:#A9B858;--leaf2:#6F8F3A;--frozen:#7FB6EA;--chilled:#5CCBB8;--dry:#F0A35E;
--haccp:#4CAF50;--sqms:#F5C518;--sens:#9B7FD6;--dqmp:#D2403F;--sup:#4CAF50;--dc:#D2403F;--store:#F5C518;--cust:#6C8EAD;
--mono:ui-monospace,"Courier New",monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--sky);overflow:hidden;color:var(--ink)}
body{font-family:var(--sans);font-weight:700;font-size:20px;line-height:1.25;font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none}
#app{position:absolute;left:0;top:0;width:1366px;height:768px;transform-origin:0 0;background:var(--sky);overflow:hidden}
.spr{display:inline-block;vertical-align:bottom;image-rendering:pixelated;flex:none}
h1,h2,h3,.mono{font-family:var(--mono);font-weight:900;margin:0}
button{font:inherit;color:inherit;cursor:pointer}

/* panels, buttons: hard shadows only */
.panel{background:var(--cream);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.card{background:var(--cream);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px 12px}
.card.red{background:var(--red);color:#fff}.card.gold{background:var(--gold)}.card.white{background:#fff}.card.dark{background:var(--glass);color:#fff}
.btn{background:var(--gold);border:4px solid var(--ink);padding:6px 16px;font-weight:900;box-shadow:inset -4px -4px 0 rgba(0,0,0,.22),inset 4px 4px 0 rgba(255,255,255,.55),4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:inset -4px -4px 0 rgba(0,0,0,.22),inset 4px 4px 0 rgba(255,255,255,.55),1px 1px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}.btn.cream{background:var(--cream)}.btn.sm{padding:2px 10px;font-size:18px}
.btn.dis{opacity:.45;pointer-events:none}

/* awning navigation */
#awning{position:absolute;left:0;top:0;width:1366px;height:50px;background:var(--red);border-bottom:4px solid var(--ink);z-index:20}
#awning:after{content:"";position:absolute;left:0;right:0;top:46px;height:10px;background:repeating-linear-gradient(90deg,var(--red) 0 20px,transparent 20px 40px);border-bottom:0}
#awning:before{content:"";position:absolute;left:0;right:0;top:46px;height:4px;background:var(--redS);z-index:1}
#tabs{position:absolute;left:0;right:0;top:0;height:46px;display:flex;justify-content:center;align-items:center;gap:8px;z-index:2}
#tabs .sp{margin:0 6px;margin-top:8px}
.tabsign{width:46px;height:34px;background:var(--cream);border:3px solid var(--ink);font:900 22px var(--mono);box-shadow:3px 3px 0 var(--ink);padding:0;display:flex;align-items:center;justify-content:center}
.tabsign.on{background:var(--gold);border-color:var(--ink);transform:translateY(2px);box-shadow:3px 3px 0 var(--redS), 0 0 0 3px var(--ink)}
.tabsign.done{background:#fff}

/* stage */
#stage{position:absolute;left:20px;top:62px;width:1326px;height:574px;z-index:5;padding:0;overflow:hidden}
#hd{padding:6px 16px 0 16px;height:104px;border-bottom:4px solid var(--ink);background:var(--cream);position:relative}
#hd .r1{display:flex;align-items:center;gap:12px;height:38px;white-space:nowrap}
#hd .num{background:var(--red);color:#fff;font:900 26px var(--mono);width:40px;height:34px;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink)}
#hd h1{font-size:28px;white-space:nowrap}
.tag{font:900 17px var(--mono);padding:1px 10px;border:3px solid var(--ink);text-transform:uppercase}
.tag.Inbound{background:var(--sup);color:#fff}.tag.Operations{background:var(--gold)}.tag.Customer{background:var(--cust);color:#fff}
#hd .spk{font-size:18px}
#hd .mh{display:flex;align-items:center;gap:10px;margin-top:6px;font:900 24px var(--mono)}
#hd .mh .chip{font-size:18px;box-shadow:2px 2px 0 var(--ink)}
#ctl{position:absolute;right:140px;bottom:122px;z-index:30;display:flex;gap:8px;align-items:center}
.pill{background:#fff;border:3px solid var(--ink);padding:0 10px;font-size:16px;height:30px;display:flex;align-items:center;white-space:nowrap;box-shadow:3px 3px 0 var(--ink)}
#bd{position:absolute;left:0;right:0;top:86px;bottom:0;padding:10px 16px;overflow:hidden}

/* score + stopwatch + hint */
#score{position:absolute;right:30px;top:66px;width:260px;height:42px;display:flex;gap:6px;z-index:30}
#score .t{flex:1;border:3px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 8px;box-shadow:3px 3px 0 var(--ink);font-size:15px;line-height:1}
#score .t b{font:900 26px var(--mono)}
#score .b{background:var(--red);color:#fff}#score .f{background:var(--gold)}
#sw{position:absolute;left:30px;bottom:128px;z-index:30;background:var(--glass);color:#fff;font:900 20px var(--mono);border:3px solid var(--ink);padding:0 10px;height:30px;display:flex;align-items:center;box-shadow:3px 3px 0 var(--ink)}
#sw.run{background:var(--red)}
#hintchip{position:absolute;right:30px;bottom:128px;z-index:30;background:var(--cream);border:3px solid var(--ink);padding:0 10px;height:30px;font-size:16px;display:flex;align-items:center;box-shadow:3px 3px 0 var(--ink)}
#hint{position:absolute;right:30px;top:130px;width:430px;z-index:60;padding:10px 14px;font-size:17px;display:none}
#hint.on{display:block}
#hint .k{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:6px 0}
#hint kbd{font:900 15px var(--mono);background:#fff;border:2px solid var(--ink);padding:0 5px;box-shadow:2px 2px 0 var(--ink);text-align:center}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;padding:6px 16px;border:3px solid #fff;display:none}

/* road strip */
#strip{position:absolute;left:0;bottom:0;width:1366px;height:124px;z-index:4}
#strip .pave{position:absolute;left:0;right:0;top:58px;height:22px;background:var(--cream2);border-top:3px solid var(--ink)}
#strip .road{position:absolute;left:0;right:0;top:80px;bottom:0;background:var(--road);border-top:3px solid var(--ink)}
#strip .road:before{content:"";position:absolute;left:0;right:0;top:19px;height:4px;background:repeating-linear-gradient(90deg,var(--lane,#F2F2F2) 0 28px,transparent 28px 56px)}
.stop{position:absolute;top:0;width:200px;margin-left:-100px;height:80px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.stop .bld{position:absolute;bottom:22px}
.stop .lb{position:absolute;bottom:3px;background:var(--cream);border:2px solid var(--ink);padding:0 6px;font:900 14px/15px var(--mono);white-space:nowrap}
.stop.cur .lb{background:var(--gold)}
.stop .tg{position:absolute;bottom:3px;left:0;width:6px;height:15px}
#truck{position:absolute;top:83px;z-index:6;transition:left .6s steps(8)}
#truck.flip svg{transform:scaleX(-1)}
/* opening */
#open{position:absolute;inset:0;z-index:100;background:var(--sky)}
#open .road{position:absolute;left:0;right:0;bottom:0;height:150px;background:var(--road);border-top:6px solid var(--ink)}
#open .road:before{content:"";position:absolute;left:0;right:0;top:64px;height:8px;background:repeating-linear-gradient(90deg,#F2F2F2 0 48px,transparent 48px 96px)}
#open .pave{position:absolute;left:0;right:0;bottom:150px;height:34px;background:var(--cream2);border-top:4px solid var(--ink)}
#open .sign{position:absolute;left:50%;top:44px;transform:translateX(-50%);padding:18px 40px;text-align:center}
#open .sign h1{font-size:46px}
#open .go{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);z-index:3;font-size:30px;padding:8px 26px;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{background:#fff}}

/* animations: stepped, pixel hops */
.new{animation:pop .4s steps(5) both}
.new.drop{animation:drop .5s steps(6) both}
.new.wipe{animation:wipe .5s steps(8) both}
.new.left{animation:fromL .5s steps(7) both}
.new.shake{animation:shake .4s steps(6) both}
@keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes drop{from{transform:translateY(-80px)}to{transform:none}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes fromL{from{transform:translateX(-120px)}to{transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--gold),4px 4px 0 var(--ink)}}
.pulse{animation:pulse 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.bob{animation:bob 1s steps(3) infinite}
@keyframes belt{from{background-position:0 0}to{background-position:-48px 0}}
@keyframes stampin{0%{transform:rotate(-12deg) scale(2.2)}100%{transform:rotate(-12deg) scale(1)}}
.stamp{display:inline-block;border:5px solid var(--red);color:var(--red);font:900 34px var(--mono);padding:0 14px;transform:rotate(-12deg);background:rgba(255,255,255,.85);animation:stampin .4s steps(4) both}
.stamp.gold{border-color:var(--goldE);color:var(--ink);background:var(--gold)}
.stamp.green{border-color:var(--haccp);color:#2d7a31}

/* typography helpers */
.big{font:900 56px/1 var(--mono)}.xl{font:900 72px/1 var(--mono)}.mid{font:900 36px/1 var(--mono)}
.red-t{color:var(--red)}.gold-t{color:var(--goldE)}
.cap{font-size:21px}.sm{font-size:18px}.lg{font-size:24px}
.row{display:flex;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}.c{text-align:center}.mt{margin-top:10px}.rel{position:relative}
.chip{color:var(--ink);display:inline-block;background:#fff;border:3px solid var(--ink);padding:1px 10px;font-size:18px;box-shadow:3px 3px 0 var(--ink)}
.chip.g{background:var(--gold)}.chip.r{background:var(--red);color:#fff}.chip.d{background:var(--glass);color:#fff}
.b13{display:inline-block;font:900 14px var(--mono);background:var(--glass);color:#fff;padding:0 6px;border:2px solid var(--ink);vertical-align:middle;margin-left:6px;white-space:nowrap}
.ghost{opacity:.35;filter:grayscale(1)}
.dashed{border:4px dashed #aaa497;box-shadow:none;background:transparent}
.hint0{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:20px;background:#fff;border:3px solid var(--ink);padding:2px 16px;white-space:nowrap}
.opener{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px}
.opener .card{font:900 38px/1.25 var(--mono);text-align:center;padding:30px 40px;max-width:1000px;background:#fff}
.cap-bar{position:absolute;left:16px;right:16px;bottom:30px;text-align:center;font-size:21px;background:#fff;border:4px solid var(--ink);padding:4px 12px;box-shadow:4px 4px 0 var(--ink)}

/* question break */
#qb{position:absolute;inset:0;z-index:70;display:none;background:rgba(43,38,34,.55)}
#qb.on{display:block}
#qb .ticket{position:absolute;left:150px;right:150px;top:70px;bottom:60px;background:var(--cream);border:6px solid var(--ink);box-shadow:10px 10px 0 var(--ink);padding:0;animation:ticketIn .5s steps(8) both;display:flex;flex-direction:column;overflow:hidden}
@keyframes ticketIn{from{transform:translateY(-520px)}to{transform:none}}
#qb .th{background:var(--red);color:#fff;font:900 28px var(--mono);padding:8px 24px;display:flex;justify-content:space-between;border-bottom:6px solid var(--ink)}
#qb .tq{flex:1;padding:22px 34px;font:900 32px/1.3 var(--mono);display:flex;align-items:center;justify-content:center;text-align:center}
#qb .ta{min-height:104px;display:flex;align-items:center;justify-content:center;padding:0 30px}
#qb .stamp{font-size:29px;max-width:880px;text-align:center;transform:rotate(-2deg);animation:stampq .4s steps(4) both;padding:6px 20px}
@keyframes stampq{0%{transform:rotate(-2deg) scale(2)}100%{transform:rotate(-2deg) scale(1)}}
#qb .tb{display:flex;gap:14px;justify-content:center;padding:6px 0 12px;min-height:62px}
#qb .tm{height:20px;background:var(--cream2);border-top:4px solid var(--ink)}
#qb .tm i{display:block;height:100%;width:100%;background:var(--red);animation:drain 15s steps(30) forwards}
@keyframes drain{from{width:100%}to{width:0}}
#concepts{position:absolute;left:20px;right:20px;bottom:140px;z-index:65;display:none;padding:12px 16px;background:var(--gold);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
#concepts.on{display:block;animation:pop .3s steps(4) both}
#concepts .cn{display:flex;gap:12px;flex-wrap:wrap}
#concepts .cc{background:#fff;border:3px solid var(--ink);padding:6px 12px;flex:1;min-width:300px}
#concepts .cc b{font-family:var(--mono)}

/* generic bits for the tabs */
.legend{font-size:20px;line-height:1.15}
.pin{position:absolute;width:22px;height:22px;margin:-22px 0 0 -11px;background:var(--red);color:#fff;border:3px solid var(--ink);font:900 14px/16px var(--mono);text-align:center;box-shadow:2px 2px 0 var(--ink)}
.pin:after{content:"";position:absolute;left:6px;top:21px;width:6px;height:6px;background:var(--ink)}
.pin.local{background:var(--gold);color:var(--ink);width:28px;height:28px;margin-left:-14px;margin-top:-28px;line-height:22px;animation:pulse 1s steps(2) infinite}
.pin.cur{background:var(--gold);color:var(--ink);animation:bob .8s steps(3) infinite}
.layer{display:block;margin:0 auto}
.slot{height:26px;margin:2px auto;width:176px}
.tile{width:238px;height:96px;display:flex;align-items:center;gap:10px;padding:6px 10px;position:relative}
.tile.glow{animation:pulse 1.6s steps(2) infinite}
.tile.held{background:#e9c9c4;border-color:var(--red)}
.mapbox{position:relative;width:392px;height:442px;flex:none;overflow:hidden}
.mapbox>svg{position:absolute;left:0;top:0}
.gate{width:206px;flex:none}
.gate .gh{display:flex;align-items:center;gap:8px;padding:4px 10px;border:4px solid var(--ink);font:900 24px var(--mono)}
.gate .gq{font-size:18px;padding:4px 8px;background:#fff;border:4px solid var(--ink);border-top:0;min-height:96px;line-height:1.2}
.beltwrap{position:relative;height:84px}
.belt{position:absolute;left:0;right:0;bottom:0;height:30px;background:var(--glass);border:4px solid var(--ink);background-image:repeating-linear-gradient(90deg,#55555c 0 24px,transparent 24px 48px);animation:belt 1.2s steps(6) infinite}
.crate{position:absolute;bottom:26px;width:80px;transition:none}
.frame{position:absolute;bottom:20px;width:110px;height:72px;border:10px solid;border-bottom:0}
.step7{display:flex;gap:8px}
.stg{flex:1;min-width:0;padding:6px 6px;text-align:center;font-size:16px;line-height:1.15;min-height:200px}
.stg h3{font-size:18px;margin-bottom:6px}
.stg.ccp{background:var(--gold)}
.numrow{display:flex;gap:16px;align-items:flex-end}
.gauge{width:170px;text-align:center;font-size:17px;line-height:1.1}
.gauge .needle{position:absolute;left:50%;bottom:6px;width:8px;height:62px;margin-left:-4px;background:var(--ink);transform-origin:50% 100%}
.fc{border-left:6px solid var(--ink);padding-left:10px}
.zone{border:4px solid var(--ink);padding:6px 10px;position:relative}
.dropz{min-height:76px}
.item{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);padding:2px 8px;box-shadow:3px 3px 0 var(--ink);cursor:grab;touch-action:none;font-size:18px}
.item.drag{position:fixed;z-index:200;pointer-events:none;transform:rotate(-3deg)}
.week{display:grid;grid-template-columns:230px repeat(7,50px) 1fr;gap:4px 6px;align-items:center}
.dayh{font:900 16px var(--mono);text-align:center}
.dot{width:30px;height:30px;margin:auto;background:var(--gold);border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.dot.off{background:transparent;border:3px dashed #b3ad9f;box-shadow:none}
.erp{background:#fff;border:4px solid var(--ink);height:100%;display:flex;flex-direction:column}
.erpbar{display:flex;background:var(--glass);gap:6px;padding:6px 8px 0}
.erpbar span{padding:2px 16px;background:#55555c;color:#ccc;font-size:20px;border:3px solid var(--ink);border-bottom:0}
.erpbar span.on{background:var(--gold);color:var(--ink)}
.vbar{width:56px;background:var(--cream2);border:3px solid var(--ink);position:relative;height:190px}
.vbar i{position:absolute;left:0;right:0;bottom:0;display:block}
@keyframes swing{0%{transform:scaleY(1)}25%{transform:scaleY(calc(1 + var(--amp)))}75%{transform:scaleY(calc(1 - var(--amp)))}100%{transform:scaleY(1)}}
.swing{transform-origin:50% 100%;animation:swing 1.4s steps(7) infinite}
.res{padding:6px 10px;text-align:center;min-width:150px}
.res b{font:900 40px var(--mono);display:block;line-height:1}
.ring{position:relative;width:240px;height:240px;flex:none}
.ring i{position:absolute;width:14px;height:14px;background:var(--cream2);border:2px solid var(--ink)}
.ring i.on{background:var(--red)}
.spin36{animation:spin36 3.2s steps(72) both}
@keyframes spin36{from{transform:rotate(0)}to{transform:rotate(12960deg)}}
.nd{padding:4px 12px;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);text-align:center;font-size:18px;white-space:nowrap}
.nd.on{background:var(--gold)}
.mover{position:absolute;left:0;top:0;offset-rotate:auto;animation:mv 6s linear infinite}
.mover.rev{offset-rotate:reverse}
@keyframes mv{from{offset-distance:0%}to{offset-distance:100%}}
.flip{perspective:600px}
.fcard{padding:6px 8px;text-align:center;min-height:150px;width:300px}
.shelf{flex:1;padding:8px}
.glowitem{animation:pulse .8s steps(2) infinite;background:var(--gold)!important}
.conf{position:absolute;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}
.sz{width:100%}

/* multiple choice */
#qb .tq{flex:none;padding:14px 34px;font-size:28px;min-height:120px}
#qb .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 26px}
#qb .opt{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:4px solid var(--ink);padding:8px 12px;box-shadow:4px 4px 0 var(--ink);font-size:21px;line-height:1.15;min-height:84px}
#qb .opt b{flex:none;width:38px;height:38px;background:var(--gold);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font:900 22px var(--mono)}
#qb .opt.sel{background:#fbeaa0;transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
#qb .opt.right{background:#cdeccd;border-color:#2d7a31;animation:pop .4s steps(5) both}
#qb .opt.wrong{background:#f3c9c4;border-color:var(--redS)}
#qb .opt.dim{opacity:.45}
#qb .ta{min-height:70px;flex:1}
#qb .stamp{font-size:22px}
#qb .tb{min-height:54px}
.scrollbox{overflow-y:auto;scrollbar-width:thick;scrollbar-color:var(--red) var(--cream2)}
.scrollbox::-webkit-scrollbar{width:16px}.scrollbox::-webkit-scrollbar-track{background:var(--cream2);border-left:3px solid var(--ink)}.scrollbox::-webkit-scrollbar-thumb{background:var(--red);border:3px solid var(--ink)}
.clean #score,.clean #sw,.clean #hintchip,.clean #hint{display:none!important}

</style></head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   EDITABLE CONTENT  (change text and numbers here, nothing else needed)
   Each block below is one "config object". Keep the quotes and commas.
   ===================================================================== */

/* SEGMENTS: one entry per tab. Change speaker names here. (def is kept for reference but is no longer shown on screen.) */
const SEGMENTS = [
  { n: 1, title: 'Farm to Factory', domain: 'Inbound', speaker: 'Speaker 1',
    def: 'Farm to factory is the upstream stage where growers and processors turn raw produce, poultry and dairy into ready-to-cook ingredients that flow to McDonald’s distribution centres.',
    key: ['14 of 40 Tier-1 suppliers', '80% of demand'] },
  { n: 2, title: 'Supplier Quality Gates', domain: 'Inbound', speaker: 'Speaker 2',
    def: 'Quality gates are the certifications, audits and taste tests a supplier must clear before its product moves down the chain.',
    key: ['4 gates', 'HACCP → SQMS → Sensory → DQMP'] },
  { n: 3, title: 'The Outsourcing Philosophy', domain: 'Inbound', speaker: 'Speaker 3',
    def: 'McDonald’s India outsources every supply chain activity to specialist partners and keeps only a very small, lean team to set standards and oversee the network.',
    key: ['100% outsourced', '40 suppliers'] },
  { n: 4, title: 'Long-Range Forecasting', domain: 'Inbound', speaker: 'Speaker 4',
    def: 'Long-range forecasting tells suppliers what is coming, so capacity is ready before a single order arrives.',
    key: ['31Q', '3-month rolling forecast'] },
  { n: 5, title: 'Arrival at the DC', domain: 'Inbound', speaker: 'Speaker 5',
    def: 'The distribution centre is where inbound logistics ends and outbound logistics begins.',

/* pix: draw a character grid. '.' is transparent. Auto 1-pixel dark outline. */
function pix(rows, o = {}) {

  const g = rows.map(r => r.padEnd(w, '.'));
  const ol = o.o === undefined ? PAL.K : o.o;
  const P = ol ? 1 : 0;
  const at = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? '.' : g[y][x];
  const fill = (x, y) => { const c = at(x, y); return c !== '.' && pal[c]; };
  const by = {};
  for (let y = -P; y < h + P; y++) for (let x = -P; x < w + P; x++) {
    let col = null;
    if (fill(x, y)) col = pal[at(x, y)];
    else if (ol && (fill(x - 1, y) || fill(x + 1, y) || fill(x, y - 1) || fill(x, y + 1))) col = ol;
    if (col) (by[col] = by[col] || []).push([x + P, y + P]);
  }
  const W = w + 2 * P, H = h + 2 * P;
  let paths = '';
  for (const col in by) {
    const pts = by[col].sort((a, b) => a[1] - b[1] || a[0] - b[0]);
    let d = '', i = 0;
    while (i < pts.length) {
      let j = i; while (j + 1 < pts.length && pts[j + 1][1] === pts[i][1] && pts[j + 1][0] === pts[j][0] + 1) j++;
      d += `M${pts[i][0]} ${pts[i][1]}h${j - i + 1}v1h-${j - i + 1}z`; i = j + 1;

/* Pixel digit helper for the dial */
function pixelDial(cx, cy, r, a0, a1, color, sz) {
  let out = '';
  for (let a = a0; a <= a1; a += 2) {
    const x = Math.round((cx + Math.cos(a * Math.PI / 180) * r) / sz) * sz, y = Math.round((cy - Math.sin(a * Math.PI / 180) * r) / sz) * sz;
    out += `<rect x="${x}" y="${y}" width="${sz}" height="${sz}" fill="${color}"/>`;
  }
  return out;
}

function TS(n = S.cur) {
  if (!S.t[n]) S.t[n] = { mode: 0, step: 0, st: mdl(n).init ? mdl(n).init() : {} };
  return S.t[n];
}
const hasOp = (n = S.cur) => !!(mdl(n).opener && TS(n).mode === 0);
const modeObj = (n = S.cur) => mdl(n).modes[TS(n).mode];
const maxStep = (n = S.cur) => modeObj(n).max + (hasOp(n) ? 1 : 0);
const effStep = (n = S.cur) => { const t = TS(n); return hasOp(n) ? (t.step <= 1 ? 0 : t.step - 1) : t.step; };
const rawOf = (e, n = S.cur) => hasOp(n) ? (e === 0 ? 0 : e + 1) : e;

/* context handed to every render/act function */
function ctx() {
  const t = TS();
  return { step: effStep(), st: t.st, raw: t.step, modeIdx: t.mode, rr: render, goEff: e => setStep(rawOf(e)), n: S.cur };
}

  $$('.tabsign').forEach(b => b.classList.toggle('on', +b.dataset.v === n));

/* ---------- stage rendering ---------- */
function renderHead() {
  const sg = SEGMENTS[S.cur - 1], tab = mdl(S.cur), t = TS();

  $('#ctl').innerHTML = `<button class="btn sm" data-a="reset">Reset</button>`;

function render() {
  if (!S.cur) return;
  renderHead();
  const bd = $('#bd'), c = ctx();
  let html;
  try {
    if (hasOp() && c.raw === 1) html = `<div class="opener"><div class="card">${esc(mdl(S.cur).opener)}</div></div>`;
    else html = modeObj().render(c);
  } catch (e) { console.warn('tab fallback', e); html = placeholder(); }

}
function setStep(raw) {
  const t = TS(), mx = maxStep();
  raw = Math.max(0, Math.min(mx, raw));
  const old = effStep(); t.step = raw;
  const m = modeObj(); if (m.sync) m.sync(t.st, effStep(), old, ctx());
  render();
}
function forward() {
  if (S.cur === 0) return go(1);
  const t = TS();
  if (t.step < maxStep()) setStep(t.step + 1);
  else if (QUESTIONS[S.cur]) openQB();
  else if (S.cur < 10) go(S.cur + 1);
}
function backward() { if (S.cur === 0) return; if (S.qb) return closeQB(false); const t = TS(); if (t.step > 0) setStep(t.step - 1); }
function cycleMode() {
  if (!S.cur) return; const tab = mdl(S.cur), t = TS();
  if (tab.modes.length < 2) return toast('This tab has one mode');
  t.mode = (t.mode + 1) % tab.modes.length; t.step = 0; t.st = tab.init ? tab.init() : {}; render();
}
function resetTab() {
  if (!S.cur) return; closeQB(false); closeConcepts();
  const t = TS(), tab = mdl(S.cur); t.step = 0; t.st = tab.init ? tab.init() : {}; render();
}

/* ---------- post-render hooks: tweens, counters, confetti ---------- */
let timers = [], raf = 0;
function post() {
  timers.forEach(clearInterval); timers = []; cancelAnimationFrame(raf);
  const bd = $('#bd');
  const tw = $$('[data-tw]', bd);
  tw.forEach(e => { const [p, f, to, ms] = e.dataset.tw.split('|'); e.style.transition = 'none'; e.style[p] = f; });
  if (tw.length) {
    void bd.offsetHeight;
    requestAnimationFrame(() => requestAnimationFrame(() => tw.forEach(e => {
      const [p, f, to, ms] = e.dataset.tw.split('|'); const cssp = p.replace(/[A-Z]/g, m => '-' + m.toLowerCase());
      e.style.transition = `${cssp} ${ms || 600}ms steps(8)`; e.style[p] = to;
    })));
  }
  $$('[data-count]', bd).forEach(e => {
    const [to, ms, dec, pre, suf] = e.dataset.count.split('|'); const total = +to; const dur = +ms || 800; const t0 = performance.now();
    const fmt = v => (pre || '') + v.toFixed(+dec || 0) + (suf || '');
    e.textContent = fmt(0);
    const id = setInterval(() => {
      const p = Math.min(1, (performance.now() - t0) / dur), q = Math.floor(p * 12) / 12;
      e.textContent = fmt(total * (p >= 1 ? 1 : q));
      if (p >= 1) clearInterval(id);
    }, 50);
    timers.push(id);
  });
  const cv = $('#confetti', bd); if (cv) confetti(cv);
  const m = modeObj(); if (m.post) m.post(ctx());
}
function confetti(cv) {
  const w = cv.width = 1300, h = cv.height = 470, g = cv.getContext('2d');
  const cols = ['#D2403F', '#F5C518', '#4CAF50', '#7FB6EA', '#9B7FD6', '#F0A35E'];
  const ps = Array.from({ length: 90 }, () => ({ x: Math.random() * w, y: -Math.random() * h, v: 3 + Math.random() * 4, s: 8 + Math.floor(Math.random() * 3) * 4, c: cols[Math.floor(Math.random() * cols.length)] }));
  (function tick() {
    g.clearRect(0, 0, w, h);
    ps.forEach(p => { p.y += p.v; if (p.y > h) { p.y = -10; p.x = Math.random() * w; } g.fillStyle = p.c; g.fillRect(Math.round(p.x / 4) * 4, Math.round(p.y / 4) * 4, p.s, p.s); });
    raf = requestAnimationFrame(tick);
  })();
}

    : `<button class="btn red" data-a="award" data-v="burger">+1 ${TEAMS.burger} (B)</button><button class="btn" data-a="award" data-v="fries">+1 ${TEAMS.fries} (Y)</button><button class="btn cream" data-a="award" data-v="skip">Skip (S)</button>`;

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key, K = k.length === 1 ? k.toLowerCase() : k;
  const stop = () => e.preventDefault();
  if (S.qb && /^[1-4]$/.test(k)) { stop(); return pickOpt(+k - 1); }
  if (/^[0-9]$/.test(k)) { stop(); return go(k === '0' ? 10 : +k); }
  if (k === 'PageDown') { stop(); return S.cur === 0 ? go(1) : nextTab(); }
  if (k === 'PageUp') { stop(); return prevTab(); }
  if (K === 'f') { stop(); return document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => { }); }
  if (K === 'h') { stop(); return toggleHint(); }
  if (K === 'p') { stop(); return swPress(); }
  if (S.cur === 0) { if (k === ' ' || k === 'Enter' || k === 'ArrowRight') { stop(); go(1); } return; }
  if (k === 'Escape') { stop(); if (S.qb) closeQB(false); else closeConcepts(); return; }

  if (k === 'ArrowUp' || k === 'ArrowDown') { stop(); const m = modeObj(); if (m.key) m.key(k, ctx()); return; }

          ${k ? `<div class="card white mt new" style="display:flex;gap:24px;align-items:center;padding:20px 30px">${SP[JOURNEY[k - 1][0]](10)}<div><div class="chip d">Segment ${k}</div><div class="mid" style="margin:6px 0">${JOURNEY[k - 1][1]}</div><div class="lg">${JOURNEY[k - 1][2]}</div></div></div>` : '<div class="card white lg c mt" style="padding:30px">One order. Nine stations. Space to follow it.</div>'}`;
      }
      if (s === 10) return `<div class="col c" style="align-items:center;gap:14px;margin-top:10px"><div class="bob">${SP.scooter(9)}</div><div class="mid">McDelivery</div><div class="lg">Launched in Mumbai and Delhi in 2004. Grown over 400% since launch.</div><div class="card red new" style="font:900 40px var(--mono);padding:14px 30px">Good logistics is business power.</div></div>`;
      if (s === 11) {
        const T = [['40', 'suppliers', '14 Tier-1'], ['100%', 'outsourced', ''], ['80%', 'reefer movement', ''], ['10', 'days max inventory', ''], ['36', 'inventory turns', ''], ['99.8%', 'fill rate', '']];
        return `<div class="mid c" style="margin-bottom:10px">Chain scorecard</div><div class="row" style="flex-wrap:wrap;gap:14px;justify-content:center">${T.map((t, i) => `<div class="card white c new" style="width:410px;height:150px;animation-delay:${i * 90}ms;display:flex;flex-direction:column;justify-content:center"><div class="xl red-t">${t[0]}</div><div class="lg">${t[1]}${t[2] ? ' / ' + t[2] : ''}</div></div>`).join('')}</div>`;
      }
      if (s === 12) return `<div class="mid c" style="margin-bottom:14px">Final score</div><div class="row" style="gap:40px;justify-content:center"><div class="card red c new" style="width:420px;padding:24px"><div class="lg">${TEAMS.burger}</div><div class="xl" style="font-size:140px">${sg.burger}</div></div><div class="card gold c new" style="width:420px;padding:24px"><div class="lg">${TEAMS.fries}</div><div class="xl" style="font-size:140px">${sg.fries}</div></div></div>`;
      if (s === 13) return `<canvas id="confetti" class="conf"></canvas><div class="col c" style="align-items:center;gap:16px;margin-top:40px;position:relative;z-index:2">${tie ? `<div class="card gold new" style="padding:24px 50px"><div class="xl" style="font-size:80px">It’s a tie!</div><div class="mid mt">${sg.burger} : ${sg.fries}</div></div>` : `<div class="card ${win === 'burger' ? 'red' : 'gold'} new" style="padding:24px 50px"><div class="lg">Winner</div><div class="xl" style="font-size:80px">${TEAMS[win]}</div><div class="mid mt">${sg.burger} : ${sg.fries}</div></div>`}<div class="lg card white">Thank you for playing!</div></div>`;
      return `<div class="col c" style="align-items:center;justify-content:center;height:100%;gap:20px"><div class="card gold new" style="padding:40px 80px"><div class="xl" style="font-size:84px">Thank you.</div><div class="xl" style="font-size:84px;margin-top:10px">Questions?</div></div>${SP.store(6)}</div>`;
    }
  }]
};

/* ---------- start ---------- */
build();
toggleHint(true);
go(0);
setInterval(swTick, 250);

</script>
